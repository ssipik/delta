[project]
name = "rag-delta"
version = "0.1.0"
description = "Pipeline module for the agentic RAG pipeline (stage 2: delta — manifest vs docstore diff)"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "dotenv>=0.9.9",
    "rag-config",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_delta"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
rag-config = { git = "https://github.com/ssipik/config.git", rev = "main" }
